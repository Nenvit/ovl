[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovl-standard-loader"
version = "1.0.1"
description = "A Python loader for typed OVL configuration files"
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "html5lib",
    "Markdown",
    "python-dateutil",
    "PyYAML",
    "validators",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ovl*"]
